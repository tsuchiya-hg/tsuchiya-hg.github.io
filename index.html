<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <link rel="stylesheet" href="./fb6f96f51c7fb782a812204a9a36eb800ab204a3c18e4da601595024b6dde346/index.css">
    <script type="text/javascript" src="sha256.js"></script>
</head>
<body>
    <form id="form">
    <p id="message">Please enter your password.</p>
    <input type="password" placeholder="password" id="password">
    </form>
    <script>
    function hash(text) {
        const sha = new jsSHA('SHA-256', 'TEXT');
        sha.update(text);
        return sha.getHash('HEX');
    }
    function auth(password) {
        const url = hash(password);
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url);
        xhr.send();
        xhr.onload = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            window.location = url;
        } else {
            const message = document.getElementById('message');
            const input = document.getElementById('password');
            message.innerHTML = 'Wrong password! Try again.';
            input.value = '';
        }
        };
        xhr.onerror = function () {
        const message = document.getElementById('message');
        message.innerHTML = 'Sorry, ERROR !';
        };
    }
    const form = document.getElementById('form');
    form.addEventListener('submit', function (event) {
        const password = document.getElementById('password').value;
        auth(password);
        event.preventDefault();
    });
    </script>
</body>
</html>
