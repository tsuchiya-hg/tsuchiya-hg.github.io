<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出席状況</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>社員出席状況</h1>
    <div id="loading" class="loading">データを読み込み中...</div>
    <div id="attendance-data"></div>
    
    <script>
        // API URL (GitHub Pages からは、API Gateway のURLを利用)
        const apiUrl = "https://f0drhcoa22.execute-api.ap-northeast-1.amazonaws.com/prod/attendance";
        
        // 出席データを取得して表示する関数
        async function fetchAttendanceData() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("データの取得に失敗しました");
                }
                
                const data = await response.json();
                const loading = document.getElementById("loading");
                loading.style.display = 'none';  // ローディングメッセージを非表示
                
                const table = document.createElement("table");
                const headerRow = document.createElement("tr");
                headerRow.innerHTML = `
                    <th>社員ID</th>
                    <th>名前</th>
                    <th>出席状況</th>
                `;
                table.appendChild(headerRow);
                
                // データをテーブルに追加
                data.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item.user_id}</td>
                        <td>${item.name}</td>
                        <td>${item.status}</td>
                    `;
                    table.appendChild(row);
                });
                
                document.getElementById("attendance-data").appendChild(table);
            } catch (error) {
                document.getElementById("loading").style.display = 'none';
                document.getElementById("attendance-data").innerHTML = `<p class="error">${error.message}</p>`;
            }
        }

        // ページが読み込まれたら出席データを取得
        window.onload = fetchAttendanceData;
    </script>
</body>
</html>
