<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出席状況</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>社員出席状況</h1>
    <div id="loading" class="loading">データを読み込み中...</div>
    <div id="attendance-data"></div>
    
    <script>
        const apiUrl = "https://f0drhcoa22.execute-api.ap-northeast-1.amazonaws.com/prod/attendance";
    
        async function fetchAttendanceData() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("データの取得に失敗しました");
                }
    
                const data = await response.json();
                document.getElementById("loading").style.display = 'none';

                // データが空の場合
                if (data.length === 0) {
                    document.getElementById("attendance-data").innerHTML = '<p class="no-data">表示するデータがありません。</p>';
                    return;
                }
    
                const now = Date.now() / 1000;
                const attendanceDataContainer = document.getElementById("attendance-data");
                attendanceDataContainer.innerHTML = ''; // 既存のデータをリセット

                // グループごとのデータを格納するオブジェクト
                const groupedData = {};

                // データをグループごとに分類
                data.forEach(item => {
                    // 有効期限切れ、ステータスが空の場合は未登録にする
                    if ((item.ttl && now > item.ttl) || !item.status || item.status.length === 0) {
                        item.status = ["未登録"];
                    }

                    // グループ名がない場合は 'なし' として扱う
                    const groupName = item.group_name || 'なし';

                    if (!groupedData[groupName]) {
                        groupedData[groupName] = [];
                    }

                    groupedData[groupName].push(item);
                });

                // グループごとにセクションを作成
                Object.keys(groupedData).forEach(groupName => {
                    const groupSection = document.createElement("div");
                    groupSection.className = "group-section";

                    const groupTitle = document.createElement("h2");
                    groupTitle.textContent = groupName === 'なし' ? 'グループなし' : groupName + 'Gr';
                    groupSection.appendChild(groupTitle);

                    // グループ内の各社員カードを追加
                    groupedData[groupName].forEach(item => {
                        const card = document.createElement("div");
                        card.className = "attendance-card";

                        // アイコンがあれば表示、なければローカルのデフォルト画像を設定
                        const icon = item.icon || 'images/default-icon.png';
                        const img = document.createElement("img");
                        img.src = icon;
                        card.appendChild(img);

                        // 名前を表示
                        const name = document.createElement("div");
                        name.className = "name";
                        name.textContent = item.name;
                        card.appendChild(name);

                        // グループ名を表示
                        const group = document.createElement("div");
                        group.className = "group";
                        group.textContent = item.group_name || '　';
                        card.appendChild(group);

                        // 状態をタグとして表示
                        const statusContainer = document.createElement("div");
                        statusContainer.className = "status";

                        // 状態をタグ形式で表示
                        statuses.forEach(status => {
                            const statusTag = document.createElement("span");
                            statusTag.className = "status-tag " + getStatusClass(status);
                            statusTag.textContent = status;
                            statusContainer.appendChild(statusTag);
                        });

                        card.appendChild(statusContainer);

                        // カードをグループセクションに追加
                        groupSection.appendChild(card);
                    });

                    // グループセクションをデータコンテナに追加
                    attendanceDataContainer.appendChild(groupSection);
                });

            } catch (error) {
                document.getElementById("loading").style.display = 'none';
                document.getElementById("attendance-data").innerHTML = `<p class="error">${error.message}</p>`;
            }
        }

        function getStatusClass(status) {
            const offStatuses = ["未登録", "退勤"];
            const onStatuses = ["出勤"];
            const fullDayOff = ["公休", "有休", "夏季特休", "振替休暇", "代休", "スキル休暇", "慶弔休暇", "看護休暇", "産休", "育休", "裁判休暇"];
            const amOff = ["振替休暇AM", "代休AM", "スキル休暇AM", "看護休暇AM", "裁判休暇AM"];
            const pmOff = ["振替休暇PM", "代休PM", "スキル休暇PM", "看護休暇PM", "裁判休暇PM"];

            if (offStatuses.includes(status)) return "status-offline";
            if (onStatuses.includes(status)) return "status-online";
            if (fullDayOff.includes(status)) return "status-fulldayoff";
            if (amOff.includes(status)) return "status-amoff";
            if (pmOff.includes(status)) return "status-pmoff";

            return "status-unknown"; // 万が一未分類でもスタイルが適用されるように
        }
    
        window.onload = fetchAttendanceData;
    </script>
</body>
</html>
